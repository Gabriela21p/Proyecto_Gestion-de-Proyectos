services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rolling-postgis
    environment:
      POSTGRES_USER: rolling
      POSTGRES_PASSWORD: rolling
      POSTGRES_DB: rolling
    ports:
      - "5432:5432"
    volumes:
      - rolling_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolling -d rolling"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: rolling-mongo
    ports:
      - "27017:27017"
    volumes:
      - rolling_mongo:/data/db

  redis:
    image: redis:7-alpine
    container_name: rolling-redis
    ports:
      - "6379:6379"
    volumes:
      - rolling_redis:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: rolling-meilisearch
    environment:
      MEILI_MASTER_KEY: rolling_master_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - rolling_meili:/meili_data

  api:
    image: node:22-alpine
    container_name: rolling-api
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://rolling:rolling@postgres:5432/rolling
      MONGO_URL: mongodb://mongo:27017/rolling
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: rolling_master_key
      OSM_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      OFFICIAL_472_ENTRY_URL: https://visor.codigopostal.gov.co/RestService472/CodigoPostal/EntryOrdinary
      OFFICIAL_472_TOKEN_URL: https://visor.codigopostal.gov.co/472/visor/javascript/layout.aspx
      OFFICIAL_472_TIMEOUT_MS: 30000
      OFFICIAL_472_TOKEN_TIMEOUT_MS: 10000
      OFFICIAL_472_TOKEN_TTL_MS: 3600000
      SEED_GOOGLE_PLACES_DEMO: "1"
    ports:
      - "4000:4000"
    volumes:
      - ./backend-node:/app
      - rolling_api_node_modules:/app/node_modules

  frontend:
    image: node:22-alpine
    container_name: rolling-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - rolling_frontend_node_modules:/app/node_modules

volumes:
  rolling_postgres:
  rolling_mongo:
  rolling_redis:
  rolling_meili:
  rolling_api_node_modules:
  rolling_frontend_node_modules:
